<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>DOM Manipulation</h1>
    <p>using setattribute and getattribute</p>
    <div class="container" id="container" title="DOM">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </div>
    <script>
        let containerDiv=document.querySelector(".container")
        // getattribute logs the attribute name
        console.log(containerDiv.getAttribute("class"))
        console.log(containerDiv.getAttribute("id"))
        console.log(containerDiv.getAttribute("title"))
        // setattribute : sets up the attribute name and value
        console.log(containerDiv.setAttribute("data-variable","priority-order"))
    </script>
</body>
</html>
