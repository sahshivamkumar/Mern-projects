<!DOCTYPE html>
<html>
<head>
<title>Stopwatch</title>

<style>
body{
    background:#f0f8ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
    text-align:center;
}

#time{
    font-size:40px;
    color:#1e3a8a;
    margin-bottom:20px;
    font-weight:bold;
}

button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:5px;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.start{background:green;}
.stop{background:red;}
.resume{background:orange;}
.reset{background:blue;}

button:hover{
    opacity:0.8;
}
</style>
</head>

<body>

<div class="box">
    <div id="time">00:00:00</div>

    <button class="start" onclick="start()">Start</button>
    <button class="stop" onclick="stop()">Stop</button>
    <button class="resume" onclick="resume()">Resume</button>
    <button class="reset" onclick="reset()">Reset</button>
</div>

<script>
let sec = 0;
let timer = null;

function update(){
    sec++;
    let h = String(Math.floor(sec/3600)).padStart(2,'0');
    let m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
    let s = String(sec%60).padStart(2,'0');
    document.getElementById("time").innerHTML = h+":"+m+":"+s;
}

function start(){
    if(timer==null)
        timer=setInterval(update,1000);
}

function stop(){
    clearInterval(timer);
    timer=null;
}

function resume(){
    if(timer==null)
        timer=setInterval(update,1000);
}

function reset(){
    clearInterval(timer);
    timer=null;
    sec=0;
    document.getElementById("time").innerHTML="00:00:00";
}
</script>

</body>
</html>
