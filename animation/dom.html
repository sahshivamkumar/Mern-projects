<!DOCTYPE html>
<html>
<head>
    <title >appendChild</title>
    <style>
        li {
            background-color: aquamarine;
        }
        
    </style>
</head>
<body>

    <div class="container">
        <p style="text-align: center;">1</p>
        <p style="text-align: center;">2</p>
        <p id="item2"style="text-align: center;">3</p>
    </div>

    <script>
        let para =document.createElement("p")
        para.innerText = "this is the new task"
        para.style.color = "black"
        para.style.fontSize = "30px"
        para.style.textAlign="center"


        let containerDiv = document.querySelector(".container")
        containerDiv.appendChild(para)
        containerDiv.style.backgroundColor="yellow"
        containerDiv.style.fontsize="30px"

        let item2 = document.querySelector("#item2")
        containerDiv.insertBefore(para,item2)
        containerDiv

    </script>
    
</body>
</html>
