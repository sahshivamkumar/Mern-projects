<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>keyword press counter</title>
</head>

<style>
    *{
    font-family: sans-serif;
    text-align: center;
    justify-content: center;
}

body{
    background:#f4f4f4;
    justify-content:center;
    align-items:center;
    border:5px solid #010101;
}


#counter{
    font-size:100px;
    color:#0077ff;
    margin-bottom:10px;
}

#disable_control{
    padding:12px 25px;
    border:none;
    background:#ff4d4d;
    color:white;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    border:2px solid #010101;
}

#disable_control:hover{
    background:#d63031;
    transform:scale(1.05);
}
</style>

<body>
    
    <h1>Keyboard Controlled Counter</h1>
    <p>press A to increase, D to decrease, S to reset</p>

    <h2 id="counter">0</h2>

    <button id="disable_control">Disable Control</button>

    <script>
        let counter=0;
        const counterElement=document.querySelector("#counter");
        const disableButton=document.querySelector("#disable_control");
        let controlEnabled=true;

        disableButton.addEventListener("click", function(){
            controlEnabled = !controlEnabled;
            disableButton.textContent = controlEnabled ? "Disable Control" : "Enable Control";
        });

        function updateCounter() {
            counterElement.textContent = counter;
        }

        document.addEventListener("keydown", function(event){
            if(!controlEnabled) return;

            
            if(event.key === "a" || event.key === "A") {
                counter++;
                updateCounter();
            } else if(event.key === "d" || event.key === "D") {
                counter--;
                updateCounter();
            } else if(event.key === "s" || event.key === "S") {
                counter = 0;
                updateCounter();
            }
        });
        
        </script>
</body>
</html>
