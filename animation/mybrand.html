<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

/* Navbar */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

nav ul{
    display:flex;
    list-style:none;
    gap:40px;
}

nav li{
    cursor:pointer;
}

/* Hero */

.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:80px;
}

.left{
    width:50%;
}

.left h1{
    font-size:60px;
    margin-bottom:25px;
}

.left p{
    font-size:24px;
    margin-bottom:30px;
}

button{
    padding:15px 35px;
    background:#4a6cf7;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.right{
    width:45%;
}

.right img{
    width:100%;
    border-radius:15px;
}

/* Responsive */

@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:20px;
    }

    nav ul{
        flex-direction:column;
        align-items:center;
    }

    .hero{
        flex-direction:column;
        text-align:center;
        padding:40px;
    }

    .left,
    .right{
        width:100%;
    }

    .left h1{
        font-size:40px;
    }

    .right img{
        margin-top:30px;
    }

}
.right img:hover{
    animation: rotateImage 2s linear infinite;
    width:50%;
}

@keyframes rotateImage{
    from{
        transform: rotate(0deg);
    }
    to{
        transform: rotate(360deg);
    }
}
</style>
<body>

    <nav>
        <h1>MyBrand</h1>

        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </nav>

    <section class="hero">

        <div class="left">

            <h1>Learn Responsive Web Design</h1>

            <p>
                Build websites that work beautifully on every device.
            </p>

            <button>Get Started</button>

        </div>

        <div class="right">

            <img src="natureimg.jpg" alt="nature">

        </div>

    </section>

</body>
</html>
