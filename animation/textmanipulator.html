<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Text Manipulator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:700px;
    background:#eaff00;
    padding:30px;
    border-radius:10px;
    border:1px solid #ccc;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:70px;
    padding:10px;
    font-size:18px;
    resize:none;
}

#output{
    margin:20px 0;
    font-size:22px;
}

button{
    width:45%;
    padding:12px;
    margin:8px;
    font-size:18px;
    background:#dd1818;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    transition:all 0.3s ease;
}

/* Hover Effect */
button:hover{
    background:#b30000;
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
}

/* Click Effect */
button:active{
    transform:scale(0.97);
}

.highlight{
    background:lime;
}
</style>

</head>
<body>

<div class="container">

<h1>Interactive Text Manipulator</h1>

<textarea id="text" placeholder="Type something..."></textarea>

<p id="output">Your text will appear here.</p>

<button onclick="showText()">Show Text</button>
<button onclick="clearText()">Clear</button><br>

<button onclick="uppercase()">Uppercase</button>
<button onclick="toggleHighlight()">Toggle Highlight</button>

<button onclick="italic()">Italic</button>

</div>

<script>

function showText(){
    let text = document.getElementById("text").value;
    document.getElementById("output").innerHTML = text;
}

function clearText(){
    document.getElementById("text").value = "";
    document.getElementById("output").innerHTML = "Your text will appear here.";
}

function uppercase(){
    let text = document.getElementById("text").value;
    document.getElementById("output").innerHTML = text.toUpperCase();
}

function toggleHighlight(){
    document.getElementById("output").classList.toggle("highlight");
}

function italic(){
    let output = document.getElementById("output");
    output.innerHTML = document.getElementById("text").value;
    output.style.fontStyle = "italic";
}


</script>

</body>
</html>
