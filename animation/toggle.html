<!DOCTYPE html>
<html lang="en">
<head>
    <title>Theme Changer</title>
    <style>
        body {
            background-color: rgb(255, 0, 0);
            color: black;
            font-family: Arial, sans-serif;
            text-align: center;
            transition: 0.3s;
        }

        .dark {
            background-color: rgb(255, 0, 174);
            color: white;
        }

        .container {
            margin-top: 100px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Theme Changer</h1>
        <p>Click the button to switch the theme</p>
        <button id="btn">Toggle Theme</button>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle("dark");
        }

        let btn = document.querySelector("#btn");
        btn.addEventListener("click", toggleTheme);
    </script>
</body>
</html>
