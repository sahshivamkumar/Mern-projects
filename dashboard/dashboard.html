<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="container">

    <div class="sidebar">

        <div class="logo">
            <h2>Dashboard</h2>
        </div>

        <div class="menu">
            <div class="item">Home</div>
            <div class="item">Dashboard</div>
            <div class="item">Profile</div>
            <div class="item">Messages</div>
            <div class="item">Settings</div>
            <div class="item">Logout</div>
        </div>

    </div>

    <div class="main">

        <div class="navbar">

            <div class="left">
                <h2>Admin Dashboard</h2>
            </div>

            <div class="right">
                <h3>Welcome User</h3>
            </div>

        </div>

        <div class="content">

            <div class="cards">

                <div class="card1">
                    <h1>150</h1>
                    <p>New Orders</p>
                </div>

                <div class="card2">
                    <h1>75%</h1>
                    <p>Bounce Rate</p>
                </div>

                <div class="card3">
                    <h1>120</h1>
                    <p>Users registration</p>
                </div>

                <div class="card4">
                    <h1>50</h1>
                    <p>Visitors</p>
                </div>

            </div>

            <div class="middle">

                <div class="chart">
                    <h2>Sales value</h2>
                </div>

                <div class="report">
                    <h2>sales value</h2>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
